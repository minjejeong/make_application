# 매일 아침 9시(한국)에 도는 자동 작업 (무료)
#  1) Supabase 깨우기 — 무료 서버는 7일 동안 아무도 안 쓰면 멈추는데, 매일 한 번 불러서 막는다
#  2) 오늘의 알림 — 오늘·내일 생일/기념일, 오늘 열리는 편지를 알림 함수(notify)에 보내 달라고 한다
# 저장소에 60일 동안 아무 변화가 없으면 GitHub이 이 예약을 멈춘다. 그러면 Actions 탭에서 다시 켜면 된다.
name: daily

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 09:00 KST
  workflow_dispatch: {}       # Actions 탭에서 손으로 돌려 볼 수도 있다

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://wlufnzpyhyrxpahvnnbg.supabase.co
      # config.js와 같은 공개용 키 (공개돼도 되는 키)
      SUPABASE_KEY: sb_publishable_-wMJ2rRUOhkpG-BF6NddPw_2C3yoiKG
    steps:
      - name: Supabase 깨우기
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/couples?select=id&limit=1" -H "apikey: $SUPABASE_KEY" -o /dev/null
          echo "깨웠어요"
      - name: 오늘의 알림 보내기
        # 알림 함수를 아직 안 만들었으면 실패하지만, 깨우기는 이미 끝났으니 전체를 실패로 두지 않는다
        continue-on-error: true
        run: |
          curl -sS -X POST "$SUPABASE_URL/functions/v1/notify" -H "Content-Type: application/json" -d '{"daily":true}'
