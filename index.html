<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="둘이서">
<meta name="description" content="둘이서 폰 하나로 하는 오프라인 술자리 게임">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>둘이서 한잔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* 술집은 어둡다 — 라이트 테마 없이 이 하나의 세계로 확정한다.
   모든 색을 명시적으로 칠해 호스트 배경을 빌리지 않는다. */
:root{
  --bg:#14161B;        /* 푸른기 도는 밤 */
  --bg2:#191C22;
  --card:#1D2027;      /* 코스터 */
  --card2:#252932;
  --line:#333944;
  --txt:#EFE9DC;       /* 따뜻한 오프화이트 */
  --dim:#A8A296;
  --dim2:#726D64;
  --acc:#7FBF6A;       /* 소주병 초록 */
  --acc2:#F0A868;      /* 백열등 주황 */
  --blush:#E2647A;     /* 벌칙 */
  --hell:#B98CF5;      /* 불지옥·끝장 */
  --ok:#7FBF6A;
  --warn:#F0A868;
  --sh:0 10px 34px rgba(0,0,0,.55);
  --disp:"Gaegu","Noto Sans KR",sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  /* 테이블 위 백열등 하나 */
  background-image:radial-gradient(120% 55% at 50% -8%, rgba(240,168,104,.10), transparent 62%);
  background-attachment:fixed;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:8px}
#app{
  min-height:100dvh; max-width:520px; margin:0 auto;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
  display:flex; flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* ---------- 공통 ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:56px; padding:14px 18px; border-radius:16px;
  background:var(--card2); border:1px solid var(--line);
  font-size:17px; font-weight:600; text-align:center; line-height:1.35;
  transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--acc);border-color:transparent;color:#14200F;font-weight:700}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.ok{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.4);color:var(--ok)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hide{display:none !important}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 2px 10px; min-height:56px;
}
.topbar h2{font-family:var(--disp);font-size:24px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;color:var(--dim);background:var(--card);border:1px solid var(--line);flex:none;
}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:28px 22px; box-shadow:var(--sh); position:relative;
}
/* 코스터 안쪽 실선 */
.card::after{
  content:""; position:absolute; inset:7px; border-radius:14px;
  border:1px solid rgba(239,233,220,.055); pointer-events:none;
}
.qtext{
  font-family:var(--disp); font-size:31px; font-weight:700;
  line-height:1.45; word-break:keep-all; text-wrap:balance;
  letter-spacing:.01em;
}
.label{font-size:13px;color:var(--dim2);font-weight:600;letter-spacing:.04em}
.hint{font-size:14px;color:var(--dim);line-height:1.6;word-break:keep-all;white-space:pre-line}

/* 미션 배지 */
#missionBar{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.mbadge{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);
  border-radius:12px;padding:9px 12px;font-size:13px;color:var(--warn);
  line-height:1.4;text-align:left;word-break:keep-all;
}
.mbadge span{flex:1}
.mbadge b{font-size:11px;opacity:.75;font-weight:700;flex:none}

/* ---------- PIN ---------- */
#pinView{flex:1;justify-content:center;gap:22px;padding-bottom:40px}
.logo{font-family:var(--disp);font-size:56px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.logo em{font-style:normal;color:var(--acc)}
.dots{display:flex;gap:16px;margin:6px 0 2px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:.15s}
.dot.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px}
.pad .btn{min-height:64px;font-size:24px;font-weight:600;border-radius:18px}
.shake{animation:sh .35s}
@keyframes sh{10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(7px)}50%{transform:translateX(-7px)}}

/* ---------- 로비 ---------- */
.names{display:flex;gap:10px;align-items:flex-start}
.pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.names input{
  width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:14px;padding:14px;font-size:16px;text-align:center;font-weight:600;
}
.names input:focus{outline:none;border-color:var(--acc2)}
.vs{font-size:13px;color:var(--dim2);font-weight:700;flex:none;padding-top:17px}
/* 성별 — 이름 칸 바로 아래. 한 번 더 누르면 해제 */
.gseg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.gseg button{flex:1;padding:7px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--dim2)}
.gseg button.on{background:var(--card2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{flex:1;padding:11px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--dim);min-height:0}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg button.on[data-lv="4"]{color:var(--hell)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px 13px;text-align:left;min-height:98px;
  display:flex;flex-direction:column;gap:5px;justify-content:flex-start;
  transition:transform .08s ease;
}
.mode:active{transform:scale(.97)}
.mode .ic{font-size:22px;line-height:1}
.mode .nm{font-family:var(--disp);font-size:21px;font-weight:700;line-height:1.2;letter-spacing:.01em}
.mode .ds{font-size:11.5px;color:var(--dim2);line-height:1.45;word-break:keep-all}
.tier{
  font-size:11px;color:var(--dim2);font-weight:700;margin:22px 0 9px;
  letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.tier::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- 게임 공통 ---------- */
#gameView{flex:1;display:flex;flex-direction:column}
#gameBody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 0 16px}
.turn{
  display:inline-flex;align-self:center;align-items:center;gap:7px;
  background:rgba(240,168,104,.10);border:1px solid rgba(240,168,104,.32);
  border-radius:999px;padding:8px 17px;font-size:14px;font-weight:700;
  color:var(--acc2);letter-spacing:.01em;
}
.choice{
  background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:22px 18px;font-size:18px;font-weight:700;line-height:1.45;
  min-height:96px;display:flex;align-items:center;justify-content:center;
  text-align:center;word-break:keep-all;transition:.12s;
}
.choice:active{transform:scale(.98)}
.choice.pick{border-color:var(--acc);background:rgba(127,191,106,.13)}
.choice{white-space:pre-line}
/* 강조 모드 (accent:true) — 지금은 쫄?만 */
.mode.only{border-color:rgba(226,100,122,.45);background:rgba(226,100,122,.07)}
.mode.only .nm{color:var(--blush)}

/* 오늘 마신 잔 수 */
#tally{
  display:flex;align-items:stretch;gap:8px;margin-top:auto;padding-top:12px;
}
.tally-side{
  flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:11px 14px;min-width:0;
}
.tally-nm{
  font-size:13px;font-weight:700;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tally-n{
  font-family:var(--disp);font-size:27px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--acc2);flex:none;
}
.tally-side.lead{border-color:rgba(226,100,122,.45);background:rgba(226,100,122,.09)}
.tally-side.lead .tally-n{color:var(--blush)}
.tally-reset{
  width:40px;border-radius:14px;flex:none;
  background:var(--card);border:1px solid var(--line);
  color:var(--dim2);font-size:15px;
}
.tally-bump{animation:tallypop .4s ease}
@keyframes tallypop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* 폭탄 심지 — 남은 시간을 숨기고 긴장만 준다 */
.fuse{font-size:56px;line-height:1;animation:fusewiggle .7s ease-in-out infinite}
@keyframes fusewiggle{
  0%,100%{transform:rotate(-7deg) scale(1)}
  50%{transform:rotate(7deg) scale(1.09)}
}

/* 쫄? 난이도 룰렛 */
.slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:150px;border-radius:22px;border:2px solid var(--line);
  background:var(--card);transition:border-color .2s, background .2s;
}
.slot-ic{font-size:52px;line-height:1}
.slot-nm{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.01em}
.slot.d1{border-color:var(--acc);background:rgba(127,191,106,.10)}
.slot.d1 .slot-nm{color:var(--acc)}
.slot.d2{border-color:var(--acc2);background:rgba(240,168,104,.10)}
.slot.d2 .slot-nm{color:var(--acc2)}
.slot.d3{border-color:var(--blush);background:rgba(226,100,122,.12)}
.slot.d3 .slot-nm{color:var(--blush)}
.slot.d4{border-color:var(--hell);background:rgba(185,140,245,.13)}
.slot.d4 .slot-nm{color:var(--hell)}
.odds{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim2);font-weight:600}
.slot.spinning .slot-ic{animation:slotpulse .09s linear infinite}
.slot.landed{animation:slotpop .45s ease}
@keyframes slotpulse{0%{opacity:.55;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes slotpop{0%{transform:scale(1)}35%{transform:scale(1.09)}100%{transform:scale(1)}}
.res{font-family:var(--disp);font-size:38px;font-weight:700;line-height:1.3;text-wrap:balance}
.res.good{color:var(--acc)} .res.bad{color:var(--blush)}
.drink{
  background:rgba(226,100,122,.12);border:1px solid rgba(226,100,122,.42);
  border-radius:16px;padding:17px;font-size:19px;font-weight:700;color:var(--blush);
  text-align:center;line-height:1.45;word-break:keep-all;
}
.timer{
  font-size:68px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
  color:var(--txt);letter-spacing:-.02em;
}
.timer.hot{color:var(--blush)}
.tin{
  width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:16px;padding:18px;font-size:20px;text-align:center;font-weight:700;
}
.tin:focus{outline:none;border-color:var(--acc2)}
.revealbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.revealbox .who{font-size:12px;color:var(--dim2);font-weight:700;margin-bottom:6px}
.revealbox .val{font-size:20px;font-weight:700;word-break:break-word}

/* 넘기기 인터스티셜 */
#pass{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;padding:32px;text-align:center;
}
#pass .big{font-size:56px}
#pass .to{font-family:var(--disp);font-size:40px;font-weight:700;line-height:1.3;word-break:keep-all;text-wrap:balance}

/* 룰렛 */
.chambers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{
  aspect-ratio:1;border-radius:50%;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--dim2);
}
.ch:active{transform:scale(.95)}
.ch.used{opacity:.35;pointer-events:none}
.ch.boom{background:rgba(226,100,122,.2);border-color:var(--blush);color:var(--blush)}
.ch.safe{background:rgba(61,220,151,.14);border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<div id="app">
  <!-- PIN -->
  <div id="pinView" class="center hide">
    <div class="logo">둘이서 <em>한잔</em></div>
    <div class="hint" id="pinMsg">비밀번호 4자리를 입력하세요</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>

  <!-- 로비 -->
  <div id="lobbyView" class="hide">
    <div class="topbar">
      <h2>둘이서 한잔</h2>
      <button class="iconbtn" id="resetBtn" aria-label="전체 초기화">🔄</button>
      <button class="iconbtn" id="lockBtn" aria-label="잠그기">🔒</button>
    </div>
    <div id="missionBar"></div>
    <div class="stack">
      <div class="names">
        <div class="pl">
          <input id="nameA" maxlength="6" placeholder="이름 1">
          <div class="gseg" data-k="A"><button data-g="m">남</button><button data-g="f">여</button></div>
        </div>
        <div class="vs">VS</div>
        <div class="pl">
          <input id="nameB" maxlength="6" placeholder="이름 2">
          <div class="gseg" data-k="B"><button data-g="m">남</button><button data-g="f">여</button></div>
        </div>
      </div>
      <div>
        <div class="label" style="margin:6px 0 8px">수위</div>
        <div class="seg" id="levelSeg">
          <button data-lv="1">순한맛</button>
          <button data-lv="2">매운맛</button>
          <button data-lv="3">핵불닭</button>
          <button data-lv="4">불지옥</button>
        </div>
      </div>
      <button class="btn primary wide" id="randomBtn">🎲 랜덤으로 시작</button>
    </div>
    <div id="modeList"></div>
    <div style="height:20px"></div>
  </div>

  <!-- 게임 -->
  <div id="gameView" class="hide">
    <div class="topbar">
      <button class="iconbtn" id="exitBtn" aria-label="나가기">←</button>
      <h2 id="gameTitle"></h2>
    </div>
    <div id="missionBar2"></div>
    <div id="gameBody"></div>
  </div>

  <!-- 오늘 마신 잔 수 -->
  <div id="tally" class="hide">
    <div class="tally-side" id="tallyA">
      <div class="tally-nm"></div>
      <div class="tally-n">0</div>
    </div>
    <button class="tally-reset" id="tallyReset" aria-label="잔 수 초기화">↺</button>
    <div class="tally-side" id="tallyB">
      <div class="tally-nm"></div>
      <div class="tally-n">0</div>
    </div>
  </div>
</div>

<!-- 폰 넘기기 -->
<div id="pass" class="hide">
  <div class="big">📱</div>
  <div class="to" id="passTo"></div>
  <div class="hint" id="passHint">상대가 화면을 보지 않게 하세요</div>
  <button class="btn primary" id="passOk" style="min-width:220px">준비 완료</button>
</div>

<script>
"use strict";

/* =====================================================================
   문항 데이터 — 여기만 고치면 문항이 추가/수정됩니다.
   level: 1=순한맛 2=매운맛 3=핵불닭 4=불지옥 5=불지옥+(여자 전용)
   g:     "m" 남자가 받을 때만 / "f" 여자가 받을 때만 (없으면 공통)
   {상대}: 기준인 사람의 상대 이름 (조사 자동)
   {남자일 때|여자일 때}: 기준인 사람 성별에 맞춰 바뀌는 스위치
   핵불닭 이상에서 남녀일 때, 여자가 받는 문항은 한 단계 위 수위에서 나온다.
   자세한 규칙은 README의 '문항 추가하기' 참고.
   ===================================================================== */
const CONTENT = {
  // 1. 밸런스 게임 — 둘이 각자 자기 화면에서 고른다. {상대}·스위치는 보는 사람 기준
  balance: [
    // ── 순한맛 · 공통
    {a:"내 유튜브 시청 기록 {상대}한테 공개", b:"내 네이버 검색 기록 {상대}한테 공개", level:1},
    {a:"내 통장 잔고 {상대}한테 공개", b:"지난달 카드 내역 {상대}한테 공개", level:1},
    {a:"고딩 때 셀카로 카톡 프사 일주일", b:"술 취해서 우는 내 영상 스토리에 하루", level:1},
    {a:"뒷담한 카톡을 당사자한테 잘못 보냄", b:"뒷담하는데 당사자가 바로 뒤에 있었음", level:1},
    {a:"친구한테 빌려준 100만 원 그냥 포기", b:"100만 원 받아내고 그 친구랑 손절", level:1},
    {a:"더치페이를 1원 단위까지 하는 친구", b:"계산할 때마다 화장실 가는 친구", level:1},
    {a:"연락 끊겼던 친구가 청첩장 주러 옴", b:"연락 끊겼던 친구가 보험 들라고 옴", level:1},

const nm = (k) => S.names[k] || (k==="A" ? "1번" : "2번");
const other = (k) => k==="A" ? "B" : "A";
/* {A}/{B}는 고정 이름으로 치환한다.
   {상대}/{나}는 "기준인 사람"(viewer) 기준으로 바뀐다 — 밸런스처럼
   둘이 각자 자기 화면에서 고르는 모드에서, 같은 문항이 양쪽 모두에게
   자연스럽게 읽히도록 하기 위한 것. viewer를 안 주면 A 기준으로 둔다. */
/* 이름 뒤에 붙은 조사만 받침에 맞춰 고른다 (지연와 → 지연과, 지연랑 → 지연이랑).
   문장 전체를 훑으면 "깊은 사이" → "깊은 사가" 처럼 멀쩡한 말을 망가뜨리므로,
   치환 시점에 그 이름 바로 뒤 한 글자만 본다. */
const JOSA_PAIR = {"와":["와","과"], "과":["와","과"],
                   "이":["가","이"], "가":["가","이"],
                   "은":["는","은"], "는":["는","은"],
                   "을":["를","을"], "를":["를","을"],
                   "랑":["랑","이랑"],
                   "야":["야","아"], "아":["야","아"],
                   "로":["로","으로"]};
function withJosa(name, rest){
  const j = rest.charAt(0);
  const pair = JOSA_PAIR[j];
  if(!pair) return name + rest;
  const c = name.trim().slice(-1).charCodeAt(0);
  const jong = (c >= 0xAC00 && c <= 0xD7A3) ? (c - 0xAC00) % 28 : 0;   // 받침 번호 (0 없음, 8 ㄹ)
  // '로'는 ㄹ 받침 뒤에서도 '로' (서울로)
  const hard = j === "로" ? (jong !== 0 && jong !== 8) : jong !== 0;
  return name + (hard ? pair[1] : pair[0]) + rest.slice(1);
}
// UI 문구용: J("A", "가 맞힐 차례") → "민수가 맞힐 차례" / "지연이 맞힐 차례"
const J = (k, rest) => withJosa(nm(k), rest);

/* 성별 스위치 {남자일 때|여자일 때} — 기준인 사람 성별에 맞는 쪽으로 바뀐다.
   이 스위치가 든 문항은 남녀가 정해졌을 때만 뽑힌다. */
const GSWITCH     = /\{([^{}|]*)\|([^{}|]*)\}/;
const GSWITCH_ALL = /\{([^{}|]*)\|([^{}|]*)\}/g;

const fill = (s, viewer) => {
  const me = viewer || "A";
  const male = S.gender[me] !== "f";
  const pick = (tag) => tag === "{A}" ? nm("A") : tag === "{B}" ? nm("B")
                      : tag === "{상대}" ? nm(other(me)) : nm(me);
  return String(s)
    .replace(GSWITCH_ALL, (m, mText, fText) => male ? mText : fText)
    // 치환자와 바로 뒤 한 글자를 함께 잡아 조사를 맞춘다
    .replace(/(\{A\}|\{B\}|\{상대\}|\{나\})(.?)/g, (m, tag, next) => withJosa(pick(tag), next));
};

/* ---- 성별 규칙 (핵불닭 이상) ----
   남녀가 정해지면 성별 문항(g:"m"/"f" 또는 스위치)이 섞이고,
   여자가 '받는' 문항은 한 단계 위 수위에서 나온다 (불지옥이면 5 = 여자 전용).
   받는 사람 = 질문 카드 대답자, O/X 주인, 진실의 눈 대답자, 미션 받는 사람, 쫄? 도전자 */
const mixed = () => !!S.gender.A && !!S.gender.B && S.gender.A !== S.gender.B;
const hotFemale = (target) => S.level >= 3 && !!target && mixed() && S.gender[target] === "f";
const step = (target, lv) => hotFemale(target) ? lv + 1 : lv;

// 이 사람(target)에게 나와도 되는 문항인가
function fits(it, target){
  if(!it.g && !it._gx) return true;            // 공통 문항
  if(S.level < 3 || !mixed()) return false;    // 성별 문항은 핵불닭 이상 + 남녀일 때만
  return !it.g || (!!target && S.gender[target] === it.g);
}

/* 수위(lv)가 맞는 문항 중에서, 한 바퀴 다 돌 때까지 겹치지 않게 하나 뽑는다.
   수위 필드가 없는 문항(3초 룰·12층 등)은 수위와 상관없이 나온다.
   key: 진행 기록 이름, lvField: 수위가 적힌 필드 (쫄?만 "dare") */
function drawFrom(key, pool, lv, target, lvField){
  const f = lvField || "level";
  const ok = pool.filter(it => (it[f] == null || it[f] === lv) && fits(it, target));
  if(!ok.length) return null;
  const seen = S.used[key] || (S.used[key] = new Set());
  let fresh = ok.filter(it => !seen.has(it));
  if(!fresh.length){ ok.forEach(it => seen.delete(it)); fresh = ok; }
  const it = fresh[Math.floor(Math.random() * fresh.length)];
  seen.add(it);
  return it;
}
// target: 이 문항을 받는 사람. 둘이 같이 보는 모드(밸런스 등)는 비워둔다.
function draw(modeId, pool, target){
  const lv = step(target, S.level);
  return drawFrom(modeId + "_" + lv, pool, lv, target);
}

let timerId = null;
// 폭탄 돌리기는 body()의 stopTimer()에 꺼지면 안 되므로 전용 타이머를 쓴다.
// 모드를 벗어날 때 이 정리 함수를 반드시 호출한다.
let bombCleanup = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function stopAllTimers(){ stopTimer(); if(bombCleanup){ bombCleanup(); bombCleanup = null; } }
// tick(남은초) 매초 호출, 0이 되면 done()
function startTimer(sec, tick, done){
  stopTimer();
  let left = sec;
  tick(left);
  timerId = setInterval(() => {
    left--;
    tick(left);
    if(left <= 0){ stopTimer(); done && done(); }
  }, 1000);
}

let pinBuf = "";
function initPin(){
  const pad = $("#pad");
  pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","","0","←"].forEach(k => {
    if(k === ""){ pad.appendChild(el("div")); return; }
    const b = el("button","btn",k);
    b.onclick = () => pinKey(k);
    pad.appendChild(b);
  });
  drawDots();
}
function drawDots(){
  const d = $("#dots"); d.innerHTML = "";
  for(let i=0;i<4;i++){ const x = el("div","dot"); if(i<pinBuf.length) x.classList.add("on"); d.appendChild(x); }
}
function pinKey(k){
  if(k === "←"){ pinBuf = pinBuf.slice(0,-1); drawDots(); return; }
  if(pinBuf.length >= 4) return;
  pinBuf += k; drawDots();
  if(pinBuf.length === 4){
    setTimeout(() => {
      if(pinBuf === PIN_CODE){ store.set(UNLOCK_KEY,"1"); pinBuf=""; drawDots(); openLobby(); }
      else{
        $("#pinMsg").textContent = "비밀번호가 틀렸어요";
        $("#dots").classList.add("shake");
        setTimeout(()=>{ $("#dots").classList.remove("shake"); pinBuf=""; drawDots(); }, 400);
      }
    }, 130);
  }
}

/* ---- 오늘 마신 잔 수 ----
   drink()가 유일한 집계 지점이다. 벌주를 새로 만들면 반드시 여기를 거치게 할 것. */
function renderTally(bump){
  const bar = $("#tally");
  bar.classList.remove("hide");
  [["A","#tallyA"],["B","#tallyB"]].forEach(([k, sel]) => {
    const side = $(sel);
    side.querySelector(".tally-nm").textContent = nm(k);
    const n = side.querySelector(".tally-n");
    n.textContent = S.cups[k];
    // 더 많이 마신 쪽을 강조 (동점이면 둘 다 평범하게)
    side.classList.toggle("lead", S.cups[k] > S.cups[other(k)]);
    if(bump === k){
      n.classList.remove("tally-bump");
      void n.offsetWidth;          // 애니메이션 재시작
      n.classList.add("tally-bump");
    }
  });
  store.set("cups", JSON.stringify(S.cups));
}

/* 벌주 한 번을 기록하고 화면에 문구를 만든다.
   who: "A" | "B" | "both",  n: 잔 수 */
function drink(who, n, msg){
  n = n || 1;
  if(who === "both"){ S.cups.A += n; S.cups.B += n; }
  else { S.cups[who] += n; }
  renderTally(who === "both" ? null : who);
  return el("div","drink", msg);
}

function renderMissions(){
  [$("#missionBar"), $("#missionBar2")].forEach(bar => {
    if(!bar) return;
    bar.innerHTML = "";
    S.missions.forEach((m, i) => {
      const b = el("div","mbadge");
      b.appendChild(el("b","", "🎯 " + m.who));
      b.appendChild(el("span","", m.text));
      const x = el("button","", "✕");
      x.style.cssText = "color:inherit;opacity:.6;font-size:15px;padding:2px 4px;flex:none";
      x.onclick = () => { S.missions.splice(i,1); renderMissions(); };
      b.appendChild(x);
      bar.appendChild(b);
    });
  });
}

function openLobby(){
  stopAllTimers();
  show("lobbyView");
  renderMissions();
}

function initLobby(){
  $("#nameA").value = store.get("nameA") || "";
  $("#nameB").value = store.get("nameB") || "";
  S.names.A = $("#nameA").value.trim();
  S.names.B = $("#nameB").value.trim();
  $("#nameA").oninput = e => { S.names.A = e.target.value.trim(); store.set("nameA", e.target.value); renderMissions(); renderTally(); };
  $("#nameB").oninput = e => { S.names.B = e.target.value.trim(); store.set("nameB", e.target.value); renderMissions(); renderTally(); };

  ["A","B"].forEach(k => {
    const g = store.get("gender" + k);
    S.gender[k] = (g === "m" || g === "f") ? g : null;
  });
  document.querySelectorAll(".gseg").forEach(seg => {
    const k = seg.dataset.k;
    [...seg.children].forEach(b => {
      b.onclick = () => {
        // 같은 쪽을 한 번 더 누르면 선택 해제
        S.gender[k] = S.gender[k] === b.dataset.g ? null : b.dataset.g;
        if(S.gender[k]) store.set("gender" + k, S.gender[k]); else store.del("gender" + k);
        syncSeg();
      };
    });
  });

  const savedLv = parseInt(store.get("level") || "2", 10);
  S.level = LEVELS.includes(savedLv) ? savedLv : 2;
  const seg = $("#levelSeg");
  [...seg.children].forEach(b => {
    b.onclick = () => {
      S.level = parseInt(b.dataset.lv, 10);
      store.set("level", String(S.level));
      S.used = {};   // 수위가 바뀌면 뽑기 풀도 초기화
      syncSeg();
      renderModes(); // 핵불닭 이상 전용 모드가 나타나거나 사라진다
    };
  });
  syncSeg();

  $("#lockBtn").onclick = () => { store.del(UNLOCK_KEY); pinBuf=""; drawDots(); $("#pinMsg").textContent="비밀번호 4자리를 입력하세요"; show("pinView"); };

  /* 전체 초기화 — 잔 수·미션·문항 진행상황·이름·성별·수위를 모두 지우고
     잠금 화면부터 다시 시작한다. */
  $("#resetBtn").onclick = () => {
    if(!confirm("전부 초기화할까요?\n\n잔 수, 미션, 지금까지 나온 문항 기록,\n이름·성별·수위가 모두 지워지고 잠금 화면으로 돌아가요.")) return;
    stopAllTimers();
    S.cups = {A:0, B:0};
    S.missions = [];
    S.used = {};
    S.names = {A:"", B:""};
    S.gender = {A:null, B:null};
    S.level = 2;
    S.starter = "A";
    $("#nameA").value = ""; $("#nameB").value = "";
    // renderTally()가 cups를 다시 저장하므로 화면 갱신을 먼저 하고 지운다
    syncSeg(); renderModes(); renderMissions(); renderTally();
    ["cups","nameA","nameB","genderA","genderB","level"].forEach(k => store.del(k));
    store.del(UNLOCK_KEY);
    $("#pass").classList.add("hide");
    pinBuf = ""; drawDots();
    $("#pinMsg").textContent = "비밀번호 4자리를 입력하세요";
    show("pinView");
  };
  $("#randomBtn").onclick = () => { const v = visibleModes(); openGame(v[Math.floor(Math.random()*v.length)].id); };

  // 잔 수: 지난 세션 값 복원 후 표시
  try{
    const saved = JSON.parse(store.get("cups") || "null");
    if(saved && typeof saved.A === "number" && typeof saved.B === "number") S.cups = saved;
  }catch(e){}
  $("#tallyReset").onclick = () => {
    if(confirm("잔 수를 0으로 되돌릴까요?")){ S.cups = {A:0, B:0}; renderTally(); }
  };
  renderTally();

  renderModes();
}

/* 현재 수위에서 열리는 모드만.
   min: 이 수위부터 나타난다   max: 이 수위까지만 나타난다 */
function visibleModes(){
  return MODES.filter(m =>
    (m.min == null || S.level >= m.min) &&
    (m.max == null || S.level <= m.max)
  );
}
function renderModes(){
  const list = $("#modeList");
  list.innerHTML = "";
  ["A","B","C"].forEach(t => {
    const ms = visibleModes().filter(m => m.tier === t);
    if(!ms.length) return;
    list.appendChild(el("div","tier", TIER_NAME[t]));
    const g = el("div","grid");
    ms.forEach(m => {
      const c = el("button","mode");
      if(m.accent) c.classList.add("only");   // 강조는 only 여부와 별개로 지정
      c.appendChild(el("div","ic", m.ic));
      c.appendChild(el("div","nm", m.nm));
      c.appendChild(el("div","ds", m.ds));
      c.onclick = () => openGame(m.id);
      g.appendChild(c);
    });
    list.appendChild(g);
  });
}
/* 수위·성별 버튼 상태를 맞춘다.
   성별 규칙(여자가 받는 문항은 한 단계 위)은 화면에 따로 적지 않는다. */
function syncSeg(){
  [...$("#levelSeg").children].forEach(b => b.classList.toggle("on", parseInt(b.dataset.lv,10) === S.level));
  document.querySelectorAll(".gseg").forEach(seg => {
    [...seg.children].forEach(b => b.classList.toggle("on", S.gender[seg.dataset.k] === b.dataset.g));
  });
}

const GAMES = {};

}

/* ---------------------------------------------------------------------
   1. 밸런스 게임 — 각자 몰래 고른 뒤 동시 공개
   --------------------------------------------------------------------- */
GAMES.balance = function(){
  const q = draw("balance", CONTENT.balance);
  const b = body();
  if(!q) return b.appendChild(el("div","card center", "이 수위에 맞는 문항이 없어요"));

  const picks = {};
  const askFor = (who) => {
    const bb = body();
    bb.appendChild(el("div","turn", nm(who) + "의 선택"));
    const card = el("div","stack");
    ["a","b"].forEach(k => {
      const c = el("button","choice", fill(q[k], who));   // 고르는 사람 기준
      c.onclick = () => {
        picks[who] = k;
        if(who === S.starter) passPhone(other(S.starter), () => askFor(other(S.starter)), "상대가 고르는 동안 보지 마세요");
        else reveal();
      };
      card.appendChild(c);
    });
    bb.appendChild(card);
    bb.appendChild(el("div","hint center", "고르면 바로 넘어가요"));
  };

  const reveal = () => {
    const bb = body();
    const same = picks.A === picks.B;
    bb.appendChild(el("div","res " + (same ? "good" : "bad"), same ? "취향 일치!" : "갈렸다!"));
    ["A","B"].forEach(k => {
      const r = el("div","revealbox");
      r.appendChild(el("div","who", nm(k)));
      r.appendChild(el("div","val", fill(q[picks[k]], k)));  // 각자 자기 기준
      bb.appendChild(r);
    });
    if(same){
      bb.appendChild(drink("both", 1, "통했으니까 둘 다 한 잔 🥂"));
      bb.appendChild(nextBtn("다음 문제 →", GAMES.balance));
    }else{
      bb.appendChild(el("div","hint center", "30초 동안 서로 설득해 보세요.\n넘어간 사람을 눌러주세요"));
      const t = el("div","timer center", "30");
      bb.appendChild(t);
      ["A","B"].forEach(k => {
        const lose = el("button","btn wide", "🍺 " + J(k, "가 넘어갔다 (한 잔)"));
        lose.onclick = () => {
          stopTimer();
          const b3 = body();
          b3.appendChild(drink(k, 1, nm(k) + " 한 잔!"));
          b3.appendChild(nextBtn("다음 문제 →", GAMES.balance));
        };
        bb.appendChild(lose);
      });
      const draw_ = el("button","btn ghost wide", "무승부 (넘어가기)");
      draw_.onclick = () => { stopTimer(); GAMES.balance(); };
      bb.appendChild(draw_);
      startTimer(30, (s) => { t.textContent = s; t.classList.toggle("hot", s <= 10); },
                 () => { t.textContent = "끝!"; });
    }
  };

  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","둘 중 하나만 고른다면?")).parentElement);
  b.appendChild(el("div","hint center", nm(S.starter) + "부터 골라요.\n상대는 화면 보지 마세요!"));
  b.appendChild(nextBtn("시작", () => askFor(S.starter)));
};

/* ---------------------------------------------------------------------
   3. 나에 대한 O/X — 본인이 정답을 정하고, 상대가 맞힌다
   --------------------------------------------------------------------- */
GAMES.ox = function(){
  const owner = S.starter, guesser = other(S.starter);
  const q = draw("ox", CONTENT.ox, owner);   // 진술하는 사람 기준
  const b = body();
  if(!q) return b.appendChild(el("div","card center", "이 수위에 맞는 문항이 없어요"));

  let answer = null;

  const setAnswer = () => {
    const bb = body();
    bb.appendChild(el("div","turn", nm(owner) + "만 보세요"));
    const card = el("div","card center");
    card.appendChild(el("div","qtext", fill(q.s, owner)));
    bb.appendChild(card);
    bb.appendChild(el("div","hint center", "사실이면 O, 아니면 X를 고르세요"));
    const row = el("div","stack");
    [["⭕ 맞다", true], ["❌ 아니다", false]].forEach(([lb, v]) => {
      const c = el("button","choice", lb);
      c.onclick = () => { answer = v; passPhone(guesser, guess, nm(owner) + "의 답은 가려져 있어요"); };
      row.appendChild(c);
    });
    bb.appendChild(row);
  };

  const guess = () => {
    const bb = body();
    bb.appendChild(el("div","turn", J(guesser, "가 맞힐 차례")));
    const card = el("div","card center");
    card.appendChild(el("div","label", nm(owner) + "의 O/X"));
    card.appendChild(el("div","qtext", fill(q.s, owner)));
    bb.appendChild(card);
    const row = el("div","stack");
    [["⭕ 맞을 것 같다", true], ["❌ 아닐 것 같다", false]].forEach(([lb, v]) => {
      const c = el("button","choice", lb);
      c.onclick = () => result(v);
      row.appendChild(c);
    });
    bb.appendChild(row);
  };

  const result = (g) => {
    const bb = body();
    const hit = (g === answer);
    bb.appendChild(el("div","res " + (hit ? "good" : "bad"), hit ? "정답! 🎯" : "땡! ❌"));
    const r = el("div","revealbox");
    r.appendChild(el("div","who", nm(owner) + "의 진짜 답"));
    r.appendChild(el("div","val", answer ? "⭕ 맞다" : "❌ 아니다"));
    bb.appendChild(r);
    bb.appendChild(drink(hit ? owner : guesser, 1, hit ? nm(owner) + " 한 잔! (읽혔네요)" : nm(guesser) + " 한 잔! (몰랐네요)"));
    bb.appendChild(el("div","hint center", "왜 그렇게 생각했는지 얘기해보세요"));
    bb.appendChild(nextBtn("다음 →", () => { S.starter = other(S.starter); GAMES.ox(); }));
  };

  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","나에 대한 O/X")).parentElement);
  b.appendChild(el("div","hint center", J(owner, "가 몰래 O/X를 정하고,\n") + J(guesser, "가 맞혀요")));
  b.appendChild(nextBtn(nm(owner) + " 시작", setAnswer));
};

GAMES.initial = function(){
  const q = draw("initial", CONTENT.initial);
  let turn = S.starter, count = 0;

  const round = () => {
    const b = body();
    b.appendChild(el("div","turn", nm(turn) + " 차례 · " + count + "번째"));
    const card = el("div","card center");
    card.appendChild(el("div","qtext", q.chars));

    b.appendChild(t);

    const ok = el("button","btn ok wide", "✅ 말했다");
    ok.onclick = () => { stopTimer(); count++; turn = other(turn); round(); };
    const fail = el("button","btn wide", "🍺 못 하겠다");
    fail.onclick = () => { stopTimer(); lose(); };
    b.appendChild(ok); b.appendChild(fail);

    startTimer(10, (s) => { t.textContent = s > 0 ? s : "0"; t.classList.toggle("hot", s <= 3); }, lose);
  };

  const lose = () => {
    stopTimer();
    const b = body();
    b.appendChild(el("div","res bad", nm(turn) + " 패배!"));
    b.appendChild(el("div","hint center", count + "개까지 이어졌어요"));
    b.appendChild(drink(turn, 1, nm(turn) + " 한 잔!"));
    b.appendChild(nextBtn("다시 →", () => { S.starter = other(S.starter); GAMES.initial(); }));
  };

  const b = body();
  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","초성 릴레이")).parentElement);
  b.appendChild(el("div","hint center", "초성이 똑같은 단어를 번갈아 말해요.\n10초 안에 못 대면 한 잔!"));
  b.appendChild(nextBtn(nm(turn) + "부터 시작", round));
};

/* ---------------------------------------------------------------------
   7. 텔레파시 — 각자 입력 후 동시 공개
   --------------------------------------------------------------------- */
GAMES.telepathy = function(){
  const q = draw("telepathy", CONTENT.telepathy);
  const ans = {};

  const input = (who) => {
    const b = body();
    b.appendChild(el("div","turn", nm(who) + " 입력"));
    const card = el("div","card center");
    card.appendChild(el("div","label", "이 단어 하면 떠오르는 건?"));
    card.appendChild(el("div","qtext", q.word));
    b.appendChild(card);
    const inp = el("input","tin");
    inp.type = "text"; inp.maxLength = 12; inp.placeholder = "한 단어"; inp.autocomplete = "off";
    b.appendChild(inp);
    const go = el("button","btn primary wide", "입력 완료");
    go.onclick = () => {
      const v = inp.value.trim();
      if(!v){ inp.focus(); return; }
      ans[who] = v;
      if(who === S.starter) passPhone(other(S.starter), () => input(other(S.starter)), "상대 답이 가려졌습니다");
      else reveal();
    };
    b.appendChild(go);
    setTimeout(()=>inp.focus(), 100);
  };

  const reveal = () => {
    const b = body();
    const norm = (s) => s.replace(/\s+/g,"").toLowerCase();
    const same = norm(ans.A) === norm(ans.B);
    b.appendChild(el("div","res " + (same ? "good" : "bad"), same ? "텔레파시 성공! 🔮" : "실패…"));
    ["A","B"].forEach(k => {
      const r = el("div","revealbox");
      r.appendChild(el("div","who", nm(k)));
      r.appendChild(el("div","val", ans[k]));
      b.appendChild(r);
    });
    b.appendChild(drink("both", 1, same ? "통했다! 둘 다 한 잔 🥂" : "안 통했다… 둘 다 한 잔 🍺"));
    b.appendChild(nextBtn("다음 →", GAMES.telepathy));
  };

  const b = body();
  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","텔레파시")).parentElement);
  b.appendChild(el("div","hint center", "각자 몰래 적어서\n같은 단어가 나오면 성공!"));
  b.appendChild(nextBtn("시작", () => input(S.starter)));
};

/* ---------------------------------------------------------------------
   9. 러시안 룰렛
   --------------------------------------------------------------------- */
GAMES.roulette = function(){
  const boom = Math.floor(Math.random() * 6);
  let turn = S.starter, done = false;

  const b = body();
  b.appendChild(el("div","turn", "6칸 중 1칸이 당첨"));
  b.appendChild(el("div","hint center", "번갈아 한 칸씩 눌러요.\n터진 사람이 마셔요"));
  const grid = el("div","chambers");
  const cells = [];
  for(let i=0;i<6;i++){
    const c = el("button","ch", "?");
    c.onclick = () => {
      if(done || c.classList.contains("used")) return;
      c.classList.add("used");
      if(i === boom){
        done = true; stopTimer();
        c.classList.remove("used"); c.classList.add("boom"); c.textContent = "💥";
        status.textContent = "";
        const r = drink(turn, 1, nm(turn) + " 당첨! 한 잔 🍺");
        b.appendChild(r);
        b.appendChild(nextBtn("다시 →", () => { S.starter = other(S.starter); GAMES.roulette(); }));
      }else{
        c.classList.add("safe"); c.textContent = "○";
        turn = other(turn);
        status.textContent = nm(turn) + " 차례";
      }
    };
    cells.push(c); grid.appendChild(c);
  }
  b.appendChild(grid);
  const status = el("div","turn", nm(turn) + " 차례");
  b.appendChild(status);
};

/* ---------------------------------------------------------------------
   10. 쫄? — 핵불닭 이상에서 열리는 도전 모드.
   칸은 고르는 게 아니라 룰렛이 정한다 (p = 확률 %). 못 하면 칸과 상관없이 한 잔.
   남녀일 때 여자는 같은 칸에서도 한 단계 센 도전을 받는다
   (가볍게 칸 → dare 2 문항 … 끝장 칸 → dare 5 = 여자 전용).
   --------------------------------------------------------------------- */
const DARE_TIER = {
  1:{nm:"가볍게", ic:"🍺", cls:"d1", p:10},
  2:{nm:"세게",   ic:"🔥", cls:"d2", p:20},
  3:{nm:"미친놈", ic:"💀", cls:"d3", p:30},
  4:{nm:"끝장",   ic:"☠️", cls:"d4", p:40},
};
function rollTier(){
  let r = Math.random() * 100;
  for(const t of [1,2,3,4]){ r -= DARE_TIER[t].p; if(r < 0) return t; }
  return 4;
}

GAMES.dare = function(){
  const who = S.starter;
  const b = body();
  b.appendChild(el("div","turn", nm(who) + " 차례"));
  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","쫄?")).parentElement);
  b.appendChild(el("div","hint center", "칸은 룰렛이 정해요. 고를 수 없어요.\n해내거나, 못 하면 한 잔"));

  // 칸 표시 슬롯 (룰렛이 여기서 돌아간다)
  const slot = el("div","slot");
  const slotIc = el("div","slot-ic", "❓");
  const slotNm = el("div","slot-nm", "???");
  slot.appendChild(slotIc); slot.appendChild(slotNm);
  b.appendChild(slot);
  const odds = el("div","odds");
  [1,2,3,4].forEach(t => odds.appendChild(el("span","", DARE_TIER[t].ic + " " + DARE_TIER[t].nm + " " + DARE_TIER[t].p + "%")));
  b.appendChild(odds);

  const spin = el("button","btn primary wide", "🎰 룰렛 돌리기");
  b.appendChild(spin);

  spin.onclick = () => {
    spin.disabled = true;
    const landed = rollTier();
    let ticks = 0;
    // 18틱 동안 칸을 훑다가 멈춘다
    const roll = () => {
      ticks++;
      const showing = ticks >= 18 ? landed : (1 + (ticks % 4));
      const t = DARE_TIER[showing];
      slotIc.textContent = t.ic;
      slotNm.textContent = t.nm;
      slot.className = "slot spinning " + t.cls;
      if(ticks >= 18){
        stopTimer();
        slot.className = "slot landed " + DARE_TIER[landed].cls;
        setTimeout(() => run(landed), 450);
      }
    };
    // startTimer는 1초 단위라 여기서는 짧은 간격으로 직접 돌린다
    stopTimer();
    timerId = setInterval(roll, 90);
  };

  const run = (want) => {
    stopTimer();
    const lv = step(who, want);                       // 여자는 한 칸 위 문항
    const q = drawFrom("dare" + lv, CONTENT.dare, lv, who, "dare");
    const t = DARE_TIER[want];
    const bb = body();
    bb.appendChild(el("div","turn", nm(who) + "의 도전"));
    const card = el("div","card center");
    card.appendChild(el("div","label", t.ic + " " + t.nm));
    card.appendChild(el("div","qtext", q ? fill(q.text, who) : "이 칸에 맞는 도전이 없어요"));   // 도전하는 사람 기준
    bb.appendChild(card);

    const done = (success) => {
      const b3 = body();
      if(success){
        b3.appendChild(el("div","res good", "해냈다! 😎"));
        b3.appendChild(el("div","hint center", "이제 " + nm(other(who)) + " 차례"));
      }else{
        b3.appendChild(el("div","res bad", "쫄았네 🐔"));
        b3.appendChild(drink(who, 1, nm(who) + " 한 잔!"));
      }
      b3.appendChild(nextBtn("다음 도전 →", () => { S.starter = other(who); GAMES.dare(); }));
      const back = el("button","btn ghost wide", "로비로");
      back.onclick = openLobby;
      b3.appendChild(back);
    };

    const ok = el("button","btn ok wide", "✅ 해냈다");
    ok.onclick = () => done(true);
    const no = el("button","btn wide", "🍺 못 하겠다 (한 잔)");
    no.onclick = () => done(false);
    bb.appendChild(ok); bb.appendChild(no);
  };
};

/* ---------------------------------------------------------------------
   11. 폭탄 돌리기 — 랜덤 시간(20~60초) 뒤 터진다. 남은 시간은 숨긴다.
   주제에 맞는 답을 번갈아 말하고, 터질 때 차례인 사람이 마신다.
   --------------------------------------------------------------------- */
GAMES.bomb = function(){
  const q = draw("bomb", CONTENT.bomb);
  let turn = S.starter, count = 0;
  /* body()가 stopTimer()를 부르므로 공용 타이머를 쓰면 화면을 그릴 때마다
     심지가 꺼진다. 폭탄은 전용 타이머로 돌린다. */
  let fuseId = null;
  const clearFuse = () => { if(fuseId){ clearInterval(fuseId); fuseId = null; } };
  bombCleanup = clearFuse;    // 모드를 벗어날 때 정리 (openGame/exit에서 호출)

  const boom = () => {
    clearFuse();
    const bb = body();
    bb.appendChild(el("div","res bad", "💥 터졌다!"));
    bb.appendChild(el("div","hint center", count + "개까지 이어졌어요"));
    bb.appendChild(drink(turn, 1, nm(turn) + " 한 잔!"));
    bb.appendChild(nextBtn("다시 →", () => { S.starter = other(S.starter); GAMES.bomb(); }));
    const back = el("button","btn ghost wide", "로비로");
    back.onclick = openLobby;
    bb.appendChild(back);
  };

  const round = () => {
    const bb = body();
    bb.appendChild(el("div","turn", nm(turn) + " 차례 · " + count + "번째"));
    const card = el("div","card center");
    card.appendChild(el("div","label", "이 주제로 하나씩"));
    card.appendChild(el("div","qtext", fill(q.q)));
    bb.appendChild(card);
    // 남은 시간을 숨긴다 — 심지가 타들어가는 것만 보여준다
    bb.appendChild(el("div","fuse center", "🧨"));
    bb.appendChild(el("div","hint center", "말했으면 바로 넘기세요"));
    const pass = el("button","btn primary wide", "말했다 → 넘기기");
    pass.onclick = () => { count++; turn = other(turn); round(); };
    bb.appendChild(pass);
  };

  const b = body();
  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","폭탄 돌리기")).parentElement);
  b.appendChild(el("div","hint center", "주제에 맞는 답을 번갈아 하나씩.\n언제 터질지는 아무도 몰라요"));
  b.appendChild(nextBtn(nm(turn) + "부터 시작", () => {
    round();
    // 20~60초 사이 랜덤. 남은 시간은 화면에 보여주지 않는다.
    let left = 20 + Math.floor(Math.random() * 41);
    clearFuse();
    fuseId = setInterval(() => { if(--left <= 0) boom(); }, 1000);
  }));
};

/* ---------------------------------------------------------------------
   12. 진실의 눈 — 답하는 사람이 진실/거짓을 정해 말하고,
   상대가 표정과 말투로 판정한다. 맞히면 답한 쪽이, 틀리면 판정한 쪽이 마신다.
   --------------------------------------------------------------------- */
GAMES.lie = function(){
  const teller = S.starter, judge = other(S.starter);
  const q = draw("lie", CONTENT.lie, teller);   // 대답하는 사람 기준
  if(!q){ const b0 = body(); return b0.appendChild(el("div","card center", "이 수위에 맞는 문항이 없어요")); }
  let truth = null;

  const setMode = () => {
    const bb = body();
    bb.appendChild(el("div","turn", nm(teller) + "만 보세요"));
    const card = el("div","card center");
    card.appendChild(el("div","label", "이 질문에 어떻게 답할까?"));
    card.appendChild(el("div","qtext", fill(q.q, teller)));
    bb.appendChild(card);
    bb.appendChild(el("div","hint center", "고른 대로 연기하세요. 상대는 몰라요"));
    const row = el("div","stack");
    [["😇 진실로 답한다", true], ["😈 거짓으로 답한다", false]].forEach(([lb, v]) => {
      const c = el("button","choice", lb);
      c.onclick = () => { truth = v; passPhone(judge, ask, nm(teller) + "의 선택은 가려져 있어요"); };
      row.appendChild(c);
    });
    bb.appendChild(row);
  };

  const ask = () => {
    const bb = body();
    bb.appendChild(el("div","turn", J(teller, "가 답할 차례")));
    const card = el("div","card center");
    card.appendChild(el("div","qtext", fill(q.q, teller)));
    bb.appendChild(card);
    bb.appendChild(el("div","hint center",
      J(teller, "가 대답하면 ") + J(judge, "가 판정해요.\n더 캐물어도 돼요")));
    const row = el("div","stack");
    [["😇 진실 같다", true], ["😈 거짓말 같다", false]].forEach(([lb, v]) => {
      const c = el("button","choice", lb);
      c.onclick = () => result(v);
      row.appendChild(c);
    });
    bb.appendChild(row);
  };

  const result = (guess) => {
    const bb = body();
    const hit = (guess === truth);
    bb.appendChild(el("div","res " + (hit ? "good" : "bad"), hit ? "간파했다! 👁️" : "속았다!"));
    const r = el("div","revealbox");
    r.appendChild(el("div","who", nm(teller) + "의 답은"));
    r.appendChild(el("div","val", truth ? "😇 진실" : "😈 거짓"));
    bb.appendChild(r);
    bb.appendChild(drink(hit ? teller : judge, 1,
      hit ? nm(teller) + " 한 잔! (읽혔네요)" : nm(judge) + " 한 잔! (속았네요)"));
    bb.appendChild(nextBtn("다음 →", () => { S.starter = other(S.starter); GAMES.lie(); }));
    const back = el("button","btn ghost wide", "로비로");
    back.onclick = openLobby;
    bb.appendChild(back);
  };

  const b = body();
  b.appendChild(el("div","card center", "").appendChild(el("div","qtext","진실의 눈")).parentElement);
  b.appendChild(el("div","hint center",
    J(teller, "가 진실이나 거짓으로 답하고,\n") + J(judge, "가 표정을 보고 맞혀요")));
  b.appendChild(nextBtn(nm(teller) + " 시작", setMode));
};
