<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="둘이서">
<meta name="description" content="둘이서 함께 쓰는 기록 · 질문 · 밸런스 게임">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>둘이서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF8F3;        /* 크림 */
  --card:#FFFFFF;
  --ink:#3A2E2B;
  --sub:#8C7B75;
  --mute:#BDAEA7;
  --line:#F1E4DB;
  --pink:#FF7C99;
  --pink-soft:#FFE6EC;
  --pink-ink:#D9506F;
  --mint:#4DB89A;
  --mint-soft:#DFF5ED;
  --sky:#5C98F2;
  --sky-soft:#E4EEFF;
  --gold:#F2A93B;
  --r:20px;
  --sh:0 6px 22px rgba(120,80,60,.08);
  --disp:"Jua","Noto Sans KR",sans-serif;
  --tabh:64px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;touch-action:manipulation}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:10px}

#app{max-width:520px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + var(--tabh) + 24px)}
#app.no-tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
#view{display:flex;flex-direction:column;gap:14px}

/* ---------- 공통 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.title{font-family:var(--disp);font-size:28px;line-height:1.25;letter-spacing:.01em}
.h2{font-family:var(--disp);font-size:21px;line-height:1.3}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:8px 2px -4px;letter-spacing:.02em}
.sub{color:var(--sub);font-size:14px}
.tiny{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;
  background:var(--pink);color:#fff;box-shadow:0 4px 14px rgba(255,124,153,.28);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%}
.btn.soft{background:var(--pink-soft);color:var(--pink-ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--sub);box-shadow:none}
.btn.line{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--pink-ink);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;
  font-size:12px;font-weight:700;background:var(--pink-soft);color:var(--pink-ink)}
.chip.mint{background:var(--mint-soft);color:#2E8F74}
.chip.sky{background:var(--sky-soft);color:#3C74C9}
.chip.gray{background:#F3EEEA;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--sub)}
.input,.textarea{width:100%;background:#FFFCFA;border:1.5px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
.input:focus,.textarea:focus{border-color:var(--pink)}
.textarea{min-height:110px;resize:vertical;line-height:1.6}
.empty{color:var(--mute);text-align:center;padding:18px 0;font-size:14px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--pink-soft);border-top-color:var(--pink);
  animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{background:#FFF1D6;color:#8A5A12;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.5}

/* ---------- 시작 화면 ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 0 10px}
.logo{font-family:var(--disp);font-size:48px;line-height:1.1;color:var(--pink-ink)}
.logo-mark{width:84px;height:84px;border-radius:26px;background:linear-gradient(145deg,#FFD9E2,#FFC1CF);
  display:grid;place-items:center;font-size:44px;box-shadow:var(--sh)}
.seg{display:flex;background:#F5EDE7;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ---------- 탭 바 ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:520px;margin:0 auto;display:flex;height:var(--tabh)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--mute);position:relative}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--pink-ink)}
#tabs button.on svg{fill:var(--pink-soft)}
#tabs .dot{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--pink)}

/* ---------- 홈 ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:4px 2px}
.names{font-family:var(--disp);font-size:24px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.names .hrt{color:var(--pink);font-size:20px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}
.dday{font-family:var(--disp);font-size:30px;color:var(--pink-ink);line-height:1;text-align:right}
.dday small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:11px;color:var(--sub);font-weight:500;margin-top:4px}
.room-bar{display:flex;align-items:center;justify-content:space-between;margin-top:-4px}
.hearts{font-family:var(--disp);font-size:20px;color:var(--pink-ink)}
.qcard{background:linear-gradient(140deg,#FFF0F3,#FFF8F0);border-radius:var(--r);padding:18px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.qcard .qt{font-family:var(--disp);font-size:21px;line-height:1.4;word-break:keep-all}
.qstat{display:flex;gap:6px;flex-wrap:wrap}
.anniv{display:flex;align-items:center;gap:12px}
.anniv .big{font-family:var(--disp);font-size:26px;color:var(--pink-ink);min-width:64px;text-align:center}

/* ---------- 우리 방 ---------- */
.room{position:relative;width:100%;aspect-ratio:1/.82;border-radius:24px;overflow:hidden;box-shadow:var(--sh);
  container-type:inline-size;user-select:none;-webkit-user-select:none;background:#FDEBDD;
  isolation:isolate}  /* 소품 z-index가 방 밖(탭 바·시트)으로 새지 않게 */
.room .wall{position:absolute;left:0;right:0;top:0;height:64%}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:36%;box-shadow:inset 0 10px 18px rgba(0,0,0,.08)}
.room .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:5%;background:rgba(255,255,255,.55)}
.obj{position:absolute;line-height:1;transform:translate(-50%,-100%) scaleX(var(--f,1));
  font-size:calc(11cqw * var(--s,1));filter:drop-shadow(0 3px 2px rgba(60,30,20,.18));touch-action:none;cursor:default}
.room.editing .obj{cursor:grab}
.obj.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--pink))}
.room-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;padding:20px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:36px}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shop button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.shop button .e{font-size:30px;line-height:1.2}
.shop button .p{color:var(--pink-ink);font-weight:700}
.shop button.own{border-color:var(--mint)}
.swatch{width:100%;aspect-ratio:1.4;border-radius:10px;border:1px solid var(--line)}

/* ---------- 캘린더 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head .h2{flex:1;text-align:center}
.navbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--sub);background:var(--card);box-shadow:var(--sh)}
.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:12px;font-weight:700;color:var(--mute)}
.week div:first-child{color:#E7798E}.week div:last-child{color:#7A9BE0}
.day{position:relative;aspect-ratio:1/1.18;border-radius:12px;background:var(--card);overflow:hidden;
  box-shadow:0 2px 8px rgba(120,80,60,.05);background-size:cover;background-position:center;padding:0}
.day .n{position:absolute;top:4px;left:6px;font-size:12px;font-weight:700}
.day.photo .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.day.today{box-shadow:0 0 0 2px var(--pink)}
.day.blank{background:transparent;box-shadow:none}
.day .memo{position:absolute;right:5px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.day .lab{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:700;color:var(--pink-ink);
  background:rgba(255,255,255,.88);text-align:center;line-height:1.6}
.entry{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry img{width:100%;border-radius:16px;background:#F5EDE7;min-height:120px;object-fit:cover}
.entry .memo-t{white-space:pre-wrap;word-break:break-word}
.pick-photo{display:flex;align-items:center;gap:10px}
.preview{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#F5EDE7}

/* ---------- 질문 ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat .ic{font-size:24px}
.cat .nm{font-family:var(--disp);font-size:18px}
.bar{height:6px;border-radius:99px;background:#F3EAE4;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{background:var(--card);border-radius:16px;padding:13px 14px;text-align:left;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(120,80,60,.05)}
.qitem .t{flex:1;word-break:keep-all}
.st{font-size:18px;flex:none}
.q-big{font-family:var(--disp);font-size:24px;line-height:1.4;word-break:keep-all;margin:6px 0 4px}
.ans{border-radius:16px;padding:13px 14px;background:#FFF5F7;display:flex;flex-direction:column;gap:4px}
.ans.them{background:#F1F6FF}
.ans .who{font-size:12px;font-weight:700;color:var(--sub)}
.ans .txt{white-space:pre-wrap;word-break:break-word}
.lock{border-radius:16px;padding:16px;background:#F7F2EE;color:var(--sub);text-align:center;font-size:14px}

/* ---------- 밸런스 ---------- */
.match{display:flex;align-items:center;gap:14px}
.match .pct{font-family:var(--disp);font-size:40px;color:var(--pink-ink);line-height:1}
.vs-wrap{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:92px;padding:18px;
  font-size:18px;font-weight:700;line-height:1.45;word-break:keep-all;box-shadow:var(--sh);transition:transform .08s,border-color .15s}
.choice:active{transform:scale(.98)}
.choice.mine{border-color:var(--pink);background:#FFF3F6}
.choice.theirs{border-color:var(--sky)}
.choice.mine.theirs{border-color:var(--pink);box-shadow:0 0 0 3px var(--sky-soft),var(--sh)}
.choice .tag{display:block;font-size:12px;font-weight:700;margin-top:6px;color:var(--sub)}
.vs{text-align:center;font-family:var(--disp);color:var(--mute);font-size:18px;margin:-4px 0}
.res{font-family:var(--disp);font-size:24px;text-align:center}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--card);border-radius:12px;padding:9px 12px}

/* ---------- 영화 · 지도 (같이 할 목록) ---------- */
a.btn{text-decoration:none}
.cat.wide{grid-column:1/-1;background:linear-gradient(140deg,#FFF3E2,#FFFBF6)}
.qitem .t{min-width:0}
.qitem .wt{display:block}
.wsub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wr{flex:none;font-size:13px;font-weight:700;color:var(--gold)}
.stars{display:flex;gap:2px;justify-content:center}
.stars button{font-size:36px;line-height:1;color:#EADFD7;padding:2px 4px;transition:transform .08s}
.stars button:active{transform:scale(.9)}
.stars button.on{color:var(--gold)}
.stars-v{color:var(--gold);font-size:18px;letter-spacing:2px;line-height:1.3}
.pcats{display:flex;flex-wrap:wrap;gap:6px}
.pcats button{padding:7px 12px;border-radius:99px;background:#F5EDE7;font-size:13px;font-weight:700;color:var(--sub)}
.pcats button.on{background:var(--pink-soft);color:var(--pink-ink);box-shadow:inset 0 0 0 1.5px var(--pink)}
.kmap-box{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#F3EFE9;isolation:isolate}
.kmap{position:relative;z-index:0;width:100%;height:min(50vh,420px);min-height:260px}
.kmap-msg{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;text-align:center;
  color:var(--sub);font-size:14px;background:#F3EFE9}
.kmap-fit{position:absolute;right:10px;top:10px;z-index:1;background:rgba(255,255,255,.95);border-radius:10px;
  padding:6px 10px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#fff;
  border:2.5px solid var(--pink);display:grid;place-items:center;box-shadow:0 3px 8px rgba(60,30,20,.28);cursor:pointer}
.pin span{display:block;transform:rotate(45deg);font-size:16px;line-height:1}
.pin.done{border-color:var(--mint);background:var(--mint-soft)}
.pin.temp{border-color:var(--sky);background:var(--sky-soft);cursor:default}
.results{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 12px 4px;display:flex;flex-direction:column;gap:6px}
.res-list{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;overscroll-behavior:contain}
.res-it{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px;border-top:1px solid var(--line);width:100%}
.res-it .t{flex:1;min-width:0}
.res-it .wt{display:block;font-weight:700}

/* ---------- 우리 ---------- */
.list{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.list .it{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list .it:last-child{border-bottom:none}
.code{font-family:var(--disp);font-size:34px;letter-spacing:.18em;color:var(--pink-ink);text-align:center}

/* ---------- 시트 / 토스트 ---------- */
#sheet{position:fixed;inset:0;z-index:60}
#sheet .dim{position:absolute;inset:0;background:rgba(40,25,20,.35);opacity:0;transition:opacity .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);
  border-radius:26px 26px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .25s ease}
#sheet.open .dim{opacity:1}
#sheet.open .panel{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:#E6D9D1;margin:2px auto 8px}
#sheet .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--card);
  box-shadow:var(--sh);font-size:16px;color:var(--sub);z-index:2}
#sheetBody{display:flex;flex-direction:column;gap:12px;clear:both}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 18px);transform:translateX(-50%);
  background:rgba(58,46,43,.92);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;
  z-index:80;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="app"><div id="view"><div class="spin"></div></div></div>

<nav id="tabs" class="hide" aria-label="메뉴"><div class="in"></div></nav>

<div id="sheet" class="hide" role="dialog" aria-modal="true">
  <div class="dim"></div>
  <div class="panel"><div class="grab"></div><button class="x" aria-label="닫기">✕</button><div id="sheetBody"></div></div>
</div>
<div id="toast" class="hide" role="status"></div>

<script>
/* 주소 끝에 ?demo를 붙이면 데모로 연다 (서버 연결 뒤에도 혼자 둘러볼 수 있게). 끝내기는 '우리' 탭의 '데모 끝내기' */
if (/[?&]demo\b/.test(location.search)) {
  try { localStorage.setItem("duriseo_mode", "demo"); } catch (e) {}
  history.replaceState(null, "", location.pathname);
}
</script>
<script src="./config.js"></script>
<script src="./vendor/supabase.min.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
<script>
/* 오프라인 지원: http(s)로 열렸을 때만 서비스 워커 등록 */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
